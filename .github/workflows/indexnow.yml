name: Ping IndexNow on new/updated guides

on:
  push:
    branches: [main]
    paths:
      - "data/guides/**"
      - "app/(site)/guide/**"

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for deployment to go live
        run: sleep 90

      - name: Submit changed guide URLs to IndexNow
        # Diff the full push range (before..after), not just the latest commit -
        # a single `git push` can carry several commits (e.g. batch clusters
        # committed separately then pushed together), and HEAD~1 alone would
        # silently miss every commit but the last one in that push.
        run: node scripts/indexnow.mjs --auto --since=${{ github.event.before }}
